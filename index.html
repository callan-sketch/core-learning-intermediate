<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Core Learning — Intermediate Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --navy: #1b2a3a; --teal: #3a8a8c; --terracotta: #d9764a; --cream: #f7f5f1; --ink: #2a2f35; --ink-mute: #6b7480; --line: #e2e0da; --white: #fff; --radius: 14px; --shadow: 0 1px 2px rgba(27,42,58,0.06), 0 8px 24px rgba(27,42,58,0.08); }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--cream); color: var(--ink); font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; min-height: 100vh; display: flex; align-items: center; justify-content: center; }
  .card { background: var(--white); border-radius: var(--radius); box-shadow: var(--shadow); padding: 48px 44px; max-width: 400px; width: 100%; margin: 24px; text-align: center; }
  h1 { font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px; color: var(--navy); margin: 0 0 8px; }
  .logo-text span { color: var(--terracotta); }
  .sub { color: var(--ink-mute); font-size: 14px; margin: 0 0 32px; }
  .spinner-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--ink-mute); font-size: 14px; }
  .spinner { width: 18px; height: 18px; border: 2px solid var(--line); border-top-color: var(--teal); border-radius: 50%; animation: spin 0.7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="card">
  <h1 class="logo-text">Core <span>Learning</span></h1>
  <p class="sub">Intermediate Course</p>
  <div class="spinner-wrap"><div class="spinner"></div><span>Signing you in…</span></div>
</div>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
  const firebaseConfig = { apiKey: "AIzaSyAN9BVXDo15Mav2zketm5jhKRoBjs2yYX8", authDomain: "core-coaching-login.firebaseapp.com", projectId: "core-coaching-login", storageBucket: "core-coaching-login.firebasestorage.app", messagingSenderId: "184932860937", appId: "1:184932860937:web:83da63f1453eff8ca824d8", measurementId: "G-N7WNPL47WQ" };
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  onAuthStateChanged(auth, (user) => {
    if (user) {
      window.location.href = "dashboard.html";
    } else {
      // Redirect to Foundations login (shared auth)
      window.location.href = "https://corelearning.co.za/login.html?redirect=intermediate";
    }
  });
</script>
</body>
</html>
